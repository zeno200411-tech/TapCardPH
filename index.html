<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Axel Hepanao | TapCard PH</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 370px;
            background: #151f32;
            border: 1px solid #2d3b53;
            border-radius: 24px;
            padding: 30px 24px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
        }

        .logo {
            color: #60a5fa;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 25px;
        }

        .avatar {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            margin: 0 auto 18px;
            background: linear-gradient(135deg, #60a5fa, #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: bold;
            color: #0b1120;
            border: 4px solid #273750;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .role {
            color: #93c5fd;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .description {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 24px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        .primary {
            background: #60a5fa;
            color: #0b1120;
        }

        .secondary {
            border: 1px solid #40516d;
            color: white;
        }

        .button:hover {
            opacity: 0.8;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="logo">TAPCARD PH</div>

        <div class="avatar">AH</div>

        <h1>Axel Hepanao</h1>

        <p class="role">Digital Business Card Creator</p>

        <p class="description">
            Welcome to my digital business card!
            I create personalized digital profiles and
            NFC business cards for professionals and businesses.
        </p>

        <a class="button primary"
           href="https://zeno200411-tech.github.io/Portf/"
           target="_blank"
           rel="noopener noreferrer">
            View My Portfolio
        </a>

        <a class="button secondary"
           href="https://www.facebook.com/"
           target="_blank"
           rel="noopener noreferrer">
            Facebook
        </a>

        <a class="button secondary"
           href="mailto:">
            Email Me
        </a>

        <p class="footer">
            TapCard PH · Connect with one tap.
        </p>

    </main>

</body>
</html>
